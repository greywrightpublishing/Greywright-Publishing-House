<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Project | Greywright Publishing House</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" sizes="32x32" href="../images/img-01.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://js.paystack.co/v2/inline.js"></script>
<style>
  :root {
    --paper: #F4EEDF; --paper-deep: #EAE0C5; --ink: #1B1814; --ink-soft: #564E42;
    --ink-faint: #8C8270; --oxblood: #6E1B26; --oxblood-deep: #4F1219;
    --brass: #9C7B2E; --line: rgba(27,24,20,0.16); --success: #3C5E45;
    --display: 'Cormorant Garamond', serif; --body: 'Spectral', Georgia, serif;
    --maxw: 860px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body);
    font-size: 16px; line-height: 1.6; min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; margin: 0; }

  header {
    background: var(--ink); padding: 18px 32px; display: flex;
    align-items: center; justify-content: space-between;
  }
  .brandmark { font-family: var(--display); font-size: 20px; color: var(--paper); font-weight: 700; }
  .brandmark em { font-style: italic; color: var(--brass); }
  .signout-btn {
    background: none; border: 1px solid rgba(244,238,223,0.3); color: var(--paper);
    padding: 8px 16px; border-radius: 3px; font-family: var(--body); font-size: 13px;
    cursor: pointer;
  }
  .signout-btn:hover { background: rgba(244,238,223,0.1); }

  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 40px 24px 80px; }

  #loading, #no-projects { text-align: center; padding: 80px 0; color: var(--ink-soft); }
  #no-projects { display: none; }

  .greeting { font-family: var(--display); font-size: 30px; margin-bottom: 32px; }
  .greeting em { font-style: italic; color: var(--oxblood); }

  .project-card {
    background: #fff; border: 1px solid var(--line); border-radius: 4px;
    padding: 32px; margin-bottom: 28px;
  }
  .project-eyebrow {
    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--brass); margin-bottom: 8px;
  }
  .project-title { font-size: 26px; margin-bottom: 4px; }
  .project-meta { font-size: 14px; color: var(--ink-soft); margin-bottom: 24px; }

  .stat-row { display: flex; gap: 24px; margin-bottom: 28px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 120px; }
  .stat-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-faint); margin-bottom: 4px; }
  .stat-value { font-family: var(--display); font-size: 24px; font-weight: 700; }
  .stat-value.status { font-size: 16px; font-weight: 600; text-transform: capitalize; }
  .stat-value.status.in_progress { color: var(--brass); }
  .stat-value.status.review { color: #2980b9; }
  .stat-value.status.completed { color: var(--success); }

  .progress-track {
    height: 6px; background: var(--paper-deep); border-radius: 3px; margin-bottom: 28px; overflow: hidden;
  }
  .progress-fill { height: 100%; background: var(--oxblood); transition: width 0.4s ease; }

  .milestones-label {
    font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 14px;
  }
  .milestone {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 0; border-top: 1px solid var(--line);
  }
  .milestone:first-of-type { border-top: none; }
  .ms-left { display: flex; align-items: center; gap: 12px; }
  .ms-icon {
    width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; font-size: 12px;
  }
  .ms-icon.paid { background: var(--success); color: #fff; }
  .ms-icon.pending { border: 2px solid var(--brass); color: transparent; }
  .ms-icon.locked { border: 2px solid var(--line); color: transparent; }
  .ms-name { font-size: 15px; font-weight: 600; }
  .ms-amount { font-size: 13px; color: var(--ink-soft); }
  .ms-right { text-align: right; }
  .ms-badge {
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 10px; border-radius: 10px; display: inline-block;
  }
  .ms-badge.paid { background: rgba(60,94,69,0.12); color: var(--success); }
  .ms-badge.locked { background: rgba(140,59,46,0.06); color: var(--ink-faint); }
  .pay-btn {
    background: var(--oxblood); color: var(--paper); border: none; padding: 9px 20px;
    border-radius: 3px; font-family: var(--body); font-size: 13.5px; cursor: pointer;
  }
  .pay-btn:hover:not(:disabled) { background: var(--oxblood-deep); }
  .pay-btn:disabled { opacity: 0.6; cursor: default; }

  .updates-section { margin-top: 28px; }
  .update-item {
    font-size: 14px; color: var(--ink-soft); padding: 10px 0; border-top: 1px solid var(--line);
  }
  .update-date { font-size: 12px; color: var(--ink-faint); margin-bottom: 2px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--paper); padding: 12px 22px; border-radius: 4px;
    font-size: 14px; display: none; z-index: 200;
  }
  .toast.error { background: var(--oxblood); }
  .toast.visible { display: block; }
</style>
</head>
<body>

<header>
  <a href="../index.html" class="brandmark">Greywright <em>Client Portal</em></a>
  <button class="signout-btn" id="signOutBtn">Sign Out</button>
</header>

<div class="wrap">
  <div id="loading">Loading your projects…</div>
  <div id="no-projects">No projects found on your account yet. If you believe this is an error, please contact us.</div>
  <div id="greeting" class="greeting" style="display:none;"></div>
  <div id="projects-container"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SUPABASE_URL = 'https://dusfpsafuhopdiyjrhyh.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1c2Zwc2FmdWhvcGRpeWpyaHloIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIxNjA4MDQsImV4cCI6MjA5NzczNjgwNH0.O70DJZi3nzCARQ3SU1qRkTbf4Q3kp9FmUf8VaiPDB8A';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const CURRENCY_SYMBOLS = { USD: '$', NGN: '₦' };

  function formatMoney(cents, currency) {
    const symbol = CURRENCY_SYMBOLS[currency] || currency + ' ';
    return symbol + (cents / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function showToast(msg, isError) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast visible' + (isError ? ' error' : '');
    setTimeout(() => { el.className = 'toast'; }, 5000);
  }

  document.getElementById('signOutBtn').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = 'login.html';
  });

  async function loadDashboard() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    const userId = session.user.id;

    const { data: clientRow } = await supabase
      .from('clients')
      .select('id, name')
      .eq('profile_id', userId)
      .maybeSingle();

    if (!clientRow) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('no-projects').style.display = 'block';
      return;
    }

    const firstName = clientRow.name.split(' ')[0];
    document.getElementById('greeting').innerHTML = `Welcome back, <em>${firstName}</em>`;

    const { data: projects } = await supabase
      .from('projects')
      .select('id, title, service_type, word_count, total_price, amount_paid, quote_currency, status, milestones(id, name, amount, order_index, status), project_updates(id, message, created_at)')
      .eq('client_id', clientRow.id)
      .order('created_at', { ascending: false });

    document.getElementById('loading').style.display = 'none';

    if (!projects || projects.length === 0) {
      document.getElementById('no-projects').style.display = 'block';
      return;
    }

    document.getElementById('greeting').style.display = 'block';
    renderProjects(projects);
  }

  function renderProjects(projects) {
    const container = document.getElementById('projects-container');
    container.innerHTML = '';

    projects.forEach(project => {
      const currency = project.quote_currency || 'NGN';
      const balance = project.total_price - project.amount_paid;
      const pct = project.total_price > 0
        ? Math.min(100, Math.round((project.amount_paid / project.total_price) * 100))
        : 0;

      const milestones = (project.milestones || []).sort((a, b) => a.order_index - b.order_index);
      const firstUnpaidIndex = milestones.findIndex(m => m.status !== 'paid');

      const card = document.createElement('div');
      card.className = 'project-card';

      card.innerHTML = `
        <div class="project-eyebrow">${escapeHtml(project.service_type || 'Editorial Project')}</div>
        <div class="project-title">${escapeHtml(project.title)}</div>
        <div class="project-meta">${project.word_count ? project.word_count.toLocaleString() + ' words' : ''}</div>

        <div class="stat-row">
          <div class="stat">
            <div class="stat-label">Total</div>
            <div class="stat-value">${formatMoney(project.total_price, currency)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Paid</div>
            <div class="stat-value">${formatMoney(project.amount_paid, currency)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Balance</div>
            <div class="stat-value">${formatMoney(balance, currency)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Status</div>
            <div class="stat-value status ${project.status}">${project.status.replace('_', ' ')}</div>
          </div>
        </div>

        <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>

        <div class="milestones-label">Milestones</div>
        <div class="milestones-list" data-project-id="${project.id}"></div>

        ${project.project_updates && project.project_updates.length > 0 ? `
          <div class="updates-section">
            <div class="milestones-label">Project Updates</div>
            ${project.project_updates
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))
              .map(u => `
                <div class="update-item">
                  <div class="update-date">${new Date(u.created_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
                  <div>${escapeHtml(u.message)}</div>
                </div>
              `).join('')}
          </div>
        ` : ''}
      `;

      container.appendChild(card);

      const listEl = card.querySelector('.milestones-list');
      milestones.forEach((ms, i) => {
        const isPaid = ms.status === 'paid';
        const isPayable = !isPaid && i === firstUnpaidIndex;
        const isLocked = !isPaid && !isPayable;

        const row = document.createElement('div');
        row.className = 'milestone';
        row.innerHTML = `
          <div class="ms-left">
            <div class="ms-icon ${isPaid ? 'paid' : isLocked ? 'locked' : 'pending'}">${isPaid ? '✓' : ''}</div>
            <div>
              <div class="ms-name">${escapeHtml(ms.name)}</div>
              <div class="ms-amount">${formatMoney(ms.amount, currency)}</div>
            </div>
          </div>
          <div class="ms-right"></div>
        `;

        const rightEl = row.querySelector('.ms-right');
        if (isPaid) {
          rightEl.innerHTML = `<span class="ms-badge paid">Paid</span>`;
        } else if (isPayable) {
          const btn = document.createElement('button');
          btn.className = 'pay-btn';
          btn.textContent = `Pay ${formatMoney(ms.amount, currency)}`;
          btn.addEventListener('click', () => payMilestone(ms.id, btn));
          rightEl.appendChild(btn);
        } else {
          rightEl.innerHTML = `<span class="ms-badge locked">Locked</span>`;
        }

        listEl.appendChild(row);
      });
    });
  }

  async function payMilestone(milestoneId, btn) {
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = 'Starting checkout…';

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    try {
      const res = await fetch('/api/initialize-milestone-payment', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${session.access_token}`,
        },
        body: JSON.stringify({ milestone_id: milestoneId }),
      });

      const data = await res.json();

      if (!res.ok || !data.access_code) {
        throw new Error(data.error || 'Could not start checkout.');
      }

      btn.textContent = originalText;
      btn.disabled = false;

      const paystackPop = new PaystackPop();
      paystackPop.resumeTransaction(data.access_code, {
        onSuccess: () => {
          showToast('Payment received — confirming with our records…');
          waitForConfirmation();
        },
        onCancel: () => {
          showToast('Checkout closed. You can try again anytime.');
        },
        onError: (err) => {
          console.error('[dashboard] Paystack error:', err);
          showToast('Something went wrong during checkout. Please try again.', true);
        },
      });
    } catch (err) {
      btn.disabled = false;
      btn.textContent = originalText;
      showToast(err.message || 'Something went wrong. Please try again.', true);
    }
  }

  // Webhook confirmation usually lands within a couple seconds — poll briefly
  // then refresh the page data rather than trusting the popup's own callback.
  async function waitForConfirmation() {
    for (let i = 0; i < 6; i++) {
      await new Promise(r => setTimeout(r, 1500));
      await loadDashboard();
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  loadDashboard();
</script>

</body>
</html>
